<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Larsen Ultimate Encyclopedia</title>

<link rel="stylesheet" href="./src/css/app.css">

</head>

<script type="module" src="./src/js/navbar.js"></script>

<body>

<main class="chapter-layout">

    <aside class="chapter-sidebar">

        <h2>Chapitres</h2>
     
        <div class="chapter-search">

    <input
        type="text"
        id="chapter-search"
        placeholder="🔍 Rechercher un chapitre..."
    >

        </div>

        <div id="chapter-list"></div>

    </aside>

    <section class="chapter-content">

        <div id="breadcrumb"></div>

        <div id="chapter"></div>

        <div class="chapter-navigation">

    <button id="previous-chapter">
        ◀ Chapitre précédent
    </button>

    <button id="next-chapter">
        Chapitre suivant ▶
    </button>

     </div>

    </section>

</main>

<script type="module" src="./src/js/encyclopedia.js"></script>

</body>

</html>
