<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Larsen Ultimate Encyclopedia</title>

<link rel="stylesheet" href="/src/css/app.css">

<link rel="stylesheet" href="/node_modules/chessground/assets/chessground.base.css">
<link rel="stylesheet" href="/node_modules/chessground/assets/chessground.cburnett.css">
<link rel="stylesheet" href="/node_modules/chessground/assets/chessground.brown.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        ♞ Larsen Ultimate Encyclopedia
    </div>

    <nav>

<a href="/">Accueil</a>

<a href="/src/pages/encyclopedia.html">
📚 Encyclopédie
</a>

<a href="/src/pages/explorer.html">
♟ Explorer
</a>

<a href="/src/pages/tree.html">
🌳 Arbre
</a>

</nav>

</header>

<main class="explorer">

    <!-- ========================= -->
    <!-- Variantes                 -->
    <!-- ========================= -->

    <aside class="left-panel">

        <h2>Variantes</h2>

        <div id="tree"></div>

    </aside>

    <!-- ========================= -->
    <!-- Echiquier                 -->
    <!-- ========================= -->

    <section class="center-panel">

        <div class="board-area">

    <div id="board"></div>

    <div class="controls">

        <button id="first">⏮</button>

        <button id="previous">◀</button>

        <button id="next">▶</button>

        <button id="last">⏭</button>

    </div>

</div>

    </section>

    <!-- ========================= -->
    <!-- Informations              -->
    <!-- ========================= -->

    <aside class="right-panel">

    <div class="tabs">

        <button class="tab active" data-tab="info">
            Informations
        </button>

        <button class="tab" data-tab="moves">
            Coups
        </button>

        <button class="tab" data-tab="notes">
            Notes
        </button>

    </div>

    <div class="tab-content active" id="info-tab">

        <div id="info">

            Sélectionnez une variante.

        </div>

    </div>

    <div class="tab-content" id="moves-tab">

        <div id="moves"></div>

    </div>

    <div class="tab-content" id="notes-tab">

        Bientôt...

    </div>

</aside>

</main>

<script type="module" src="/src/js/tree.js"></script>
<script type="module" src="/src/js/board.js"></script>

</body>
</html>

<script type="module" src="/src/js/tabs.js"></script>
